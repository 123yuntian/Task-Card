<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>test-agent-zc</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
    background: #1e1e2e;
    color: #cdd6f4;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    transition: background-color 0.3s, color 0.3s;
  }
  #clock {
    font-size: 72px;
    font-weight: normal;
    font-variant-numeric: tabular-nums;
  }
  #clock.bold {
    font-weight: 900;
  }
  .btn-row {
    display: flex;
    gap: 16px;
  }
  button {
    padding: 10px 24px;
    font-size: 16px;
    border: 1px solid #585b70;
    border-radius: 8px;
    background: #313244;
    color: #cdd6f4;
    cursor: pointer;
  }
  button:hover {
    background: #45475a;
  }
</style>
</head>
<body>
  <div id="clock">--:--:--</div>
  <div class="btn-row">
    <button id="btn-color">换色</button>
    <button id="btn-bold">加粗</button>
    <button id="btn-reset">重置</button>
  </div>
<script>
  // 双击 file:// 打开也能跑，所以不用 ES Module，脚本直接内联
  var clockEl = document.getElementById('clock');
  var btnColor = document.getElementById('btn-color');
  var btnBold = document.getElementById('btn-bold');
  var btnReset = document.getElementById('btn-reset');

  // 换色用的主题列表，循环切换
  var themes = [
    { bg: '#1e1e2e', fg: '#cdd6f4' }, // 默认深蓝灰
    { bg: '#2d2a2a', fg: '#f5c2a0' }, // 暖棕
    { bg: '#1a2b26', fg: '#a6e3a1' }, // 墨绿
    { bg: '#241f31', fg: '#cba6f7' }  // 紫调
  ];
  var themeIndex = 0;

  function pad(n) {
    return String(n).padStart(2, '0');
  }

  function renderClock() {
    var now = new Date();
    clockEl.textContent = pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
  }

  // 每秒刷新时间（第 70 行附近，全局唯一的 setInterval）
  setInterval(renderClock, 1000);
  renderClock(); // 打开页面立即显示，不等第一秒

  btnColor.addEventListener('click', function () {
    themeIndex = (themeIndex + 1) % themes.length;
    document.body.style.backgroundColor = themes[themeIndex].bg;
    document.body.style.color = themes[themeIndex].fg;
  });

  btnBold.addEventListener('click', function () {
    clockEl.classList.toggle('bold');
  });

  btnReset.addEventListener('click', function () {
    themeIndex = 0;
    document.body.style.backgroundColor = '';
    document.body.style.color = '';
    clockEl.classList.remove('bold');
  });
</script>
</body>
</html>
